{% set name = "molscrub" %}
{% set version = "0.3.0" %}
{% set python_min = "3.9" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/molscrub-{{ version }}.tar.gz
  sha256: c17d64684af3bfae311bea013ad7fd2e9fb11abfc4e3854a602e551d46c87365

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - rdkit >=2022.03.1

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - molscrub
  commands:
    - scrub.py --help
    - pip check

about:
  home: https://github.com/forlilab/molscrub
  summary: 'Enumerate states of small organic molecules: 3D coordinates, tautomers, pH-based adjustments'
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - joanimato
    - diogomart
