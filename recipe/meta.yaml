{% set name = "molscrub" %}
{% set version = "0.3.2" %}
{% set python_min = "3.9" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/molscrub-{{ version }}.tar.gz
  sha256: 4ce02c9ed12980153fbe15339efcfc856961f72dcee227301a0f06b80f504180

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - joblib
    - pip
    - rich
  run:
    - python >={{ python_min }}
    - rdkit >=2022.03.1
    - joblib
    - rich

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - molscrub
  commands:
    - scrub.py --help
    - pip check

about:
  home: https://github.com/forlilab/molscrub
  summary: 'Enumerate states of small organic molecules: 3D coordinates, tautomers, pH-based adjustments'
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - joanimato
    - diogomart
